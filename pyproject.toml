[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-agent-starter"
version = "0.1.0"
description = "Reference outbound and inbound voice agent: Twilio SIP trunking into OpenAI's Realtime API, with tool calling, call transcripts, and a call-quality eval harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andre Bernal" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # starlette.testclient (used by fastapi.testclient in tests/test_server.py)
    # prefers httpx2 over httpx and warns without it. Installed so the test
    # suite runs warning-free instead of silencing a real deprecation notice.
    "httpx2>=2.0",
]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent", "evals"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
